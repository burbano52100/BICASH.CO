  #   build: ./backend
  #   env_file: ./backend/.env
  #   ports:
  #     - "4000:4000"
  #   depends_on:
  #     - db

  # Opcional: frontend
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "8443:8443"
  #   depends_on:
  #     - backend

volumes:
  pgdata:
